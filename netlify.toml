[build]
  command = "node build.mjs"
  publish = "dist"

# Add ashbridgedesign.com and www.ashbridgedesign.co.uk as domain aliases in
# Netlify; these rules send them all to the one canonical address.
[[redirects]]
  from = "https://ashbridgedesign.com/*"
  to = "https://ashbridgedesign.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ashbridgedesign.com/*"
  to = "https://ashbridgedesign.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ashbridgedesign.co.uk/*"
  to = "https://ashbridgedesign.co.uk/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
